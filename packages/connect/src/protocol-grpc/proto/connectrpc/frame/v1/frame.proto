syntax = "proto3";

package connectrpc.frame.v1;

option go_package = "connectrpc.com/connect/v2/internal/gen/connect/frame/v1;framev1";

message Header {
  string key = 1;
  repeated string values = 2;
}

message Headers {
  repeated Header fields = 1;
}
